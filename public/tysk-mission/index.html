${av} ${player} · Opgave ${i+1}/${qs.length}`;$('instr').textContent=q[1];$('emoji').textContent=q[6]||'';$('prompt').textContent=q[2];$('speak').classList.toggle('hide',!q[5]);$('speak').onclick=()=>speak(q[5]);$('answers').innerHTML=q[3].map((x,n)=>`<button class="ans" data-n="${n}">${n+1}. ${x}</button>`).join('');document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>choose(+b.dataset.n,b));$('fb').className='fb hide';$('next').classList.add('hide');$('prog').style.width=(i/qs.length*100)+'%';$('map').innerHTML=qs.map((_,n)=>`<div class="${n<i?'done ':''}${n===i?'here ':''}${(n+1)%5===0?'boss':''}">${n<i?'✓':(n+1)%5===0?'👑':n+1}</div>`).join('')}function speak(t){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function choose(n,b){if(done)return;done=true;let q=qs[i],boss=(i+1)%5===0,bs=[...document.querySelectorAll('.ans')];bs[q[4]].classList.add('ok');if(n===q[4]){streak++;let g=(100+Math.min(streak-1,5)*20)*(boss?2:1);score+=g;$('fb').textContent=`Richtig! +${g} point 🎉`;$('fb').className='fb good'}else{b.classList.add('no');life--;streak=0;$('fb').textContent='Ikke helt. Rigtigt svar: '+q[3][q[4]];$('fb').className='fb bad'}hud();$('next').textContent=(life<=0||i===qs.length-1)?'Se resultat':'Næste →';$('next').classList.remove('hide')}function hud(){$('life').textContent=life;$('streak').textContent=streak;$('score').textContent=score}function next(){if(life<=0||i===qs.length-1)return finish();i++;render()}function finish(){$('game').classList.add('hide');$('hud').classList.add('hide');$('end').classList.remove('hide');$('endav').textContent=av;$('final').textContent=score+' point';let pct=score/(qs.length*150),st='⭐',t='Godt kæmpet!',tx='Prøv igen og slå din score.';if(pct>.72){st='⭐⭐⭐';t='Deutsch-Meister!';tx=`Stærkt, ${player}!`}else if(pct>.42){st='⭐⭐';t='Stærk mission!';tx=`Flot, ${player}. Du er godt på vej.`}$('stars').textContent=st;$('endtitle').textContent=t;$('endtext').textContent=tx;let xs=[];try{xs=JSON.parse(localStorage.getItem('tm3')||'[]')}catch{}xs.push({n:player,a:av,s:score});xs.sort((a,b)=>b.s-a.s);xs=xs.slice(0,5);localStorage.setItem('tm3',JSON.stringify(xs));$('high').innerHTML='<b>🏅 Highscore</b><br>'+xs.map((x,n)=>`${n+1}. ${x.a} ${x.n} — ${x.s} point`).join('<br>')}$('go').onclick=start;$('next').onclick=next;$('again').onclick=start;$('menu').onclick=()=>{$('end').classList.add('hide');$('start').classList.remove('hide')};document.addEventListener('keydown',e=>{let n=+e.key;if(n>=1&&n<=4&&!done&&!$('game').classList.contains('hide'))document.querySelectorAll('.ans')[n-1]?.click();if(e.key==='Enter'&&!$('next').classList.contains('hide'))$('next').click()});</script></body></html>
