<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch & Drachen</title><style>body{margin:0;background:#101820;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:680px;padding:28px;text-align:center}button{padding:12px 18px;border:0;border-radius:12px;font:inherit;font-weight:700}#err{color:#ffb4b4;white-space:pre-wrap}</style></head><body><div class="box"><h1>🐉 Deutsch & Drachen</h1><p>Das Abenteuer wird geladen …</p><p id="err"></p></div><script>(async()=>{try{const urls=['dd-parts/gz1.txt','dd-parts/gz2.txt','dd-parts/gz3.txt'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Kunne ikke hente '+u);return (await r.text()).trim()}));const b64=parts.join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Denne browser understøtter ikke den nødvendige dekomprimering. Prøv Chrome, Edge eller en nyere Safari.');const ds=new DecompressionStream('gzip');const stream=new Blob([bin]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('err').textContent='Fejl ved indlæsning: '+e.message}})();</script></body></html>
