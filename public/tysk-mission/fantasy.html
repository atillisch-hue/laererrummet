<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch & Drachen</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3b4b43,#101a20 48%,#080d12);color:#f6f1df;font-family:system-ui,Segoe UI,Arial;min-height:100vh;padding:16px}.app{max-width:1200px;margin:auto}.panel{background:#151d22ef;border:1px solid #ffffff22;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0008}.hide{display:none!important}h1,h2,h3{font-family:Georgia,serif}.hero{text-align:center;font-size:4rem}.sub{color:#c8d0cb}.setupGrid,.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.class,.btn,.answer,.choice{border:1px solid #ffffff24;background:#26333a;color:#fff;border-radius:14px;padding:13px;font:inherit;font-weight:800;cursor:pointer}.class.on{outline:3px solid #e2bd61;background:#394b45}.btn{background:#9a642e}.btn.green{background:#356b52}.btn.red{background:#7b3740}.btn.blue{background:#365f86}.wide{width:100%}.name{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff33;background:#0e171c;color:#fff;font:inherit}.gamegrid{display:grid;grid-template-columns:1fr 330px;gap:14px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.space{min-height:88px;border-radius:15px;background:#26343a;border:1px solid #ffffff18;padding:7px;position:relative;font-size:.82rem}.space.current{outline:3px solid #e7c363}.num{opacity:.5;font-size:.7rem}.icon{font-size:1.7rem}.tokens{display:flex;gap:2px;flex-wrap:wrap;font-size:1.35rem;position:absolute;bottom:4px;left:5px}.stats{display:grid;gap:8px}.player{background:#202c32;border-radius:14px;padding:10px;border:1px solid #ffffff18}.player.turn{outline:2px solid #e7c363}.meter{display:flex;justify-content:space-between;gap:5px;font-size:.84rem;flex-wrap:wrap}.inventory{font-size:.78rem;color:#d7ddd8;margin-top:6px}.log{height:160px;overflow:auto;background:#0d1519;padding:9px;border-radius:12px;font-size:.83rem}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{max-width:700px;width:100%;background:#f7f0dd;color:#1d292b;border-radius:22px;padding:24px;box-shadow:0 25px 90px #000}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#e7ddbf;font-weight:900;font-size:.8rem}.q{font-size:1.45rem;font-weight:900;margin:14px 0}.answers,.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer,.choice{background:#fff;color:#233;border:2px solid #ddd}.answer:hover,.choice:hover{border-color:#9a642e}.answer.ok{background:#dff3e7;border-color:#3a9b6c}.answer.no{background:#f8dfe2;border-color:#bb5260}.feedback{font-weight:900;margin-top:12px}.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.topbar h1{margin:0;margin-right:auto}.die{font-size:2.5rem}.duelbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.end{text-align:center}.score{font-size:3rem;color:#e7c363;font-weight:1000}.itemcard{background:#f0e7cf;border-radius:14px;padding:10px;margin:8px 0}.monster{font-size:4rem;text-align:center}.small{font-size:.88rem;color:#53615d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(max-width:850px){.gamegrid{grid-template-columns:1fr}.setupGrid,.classes{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(5,1fr)}}@media(max-width:520px){.answers,.choices,.duelbox,.actions{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,1fr)}.space{min-height:68px;padding:4px}.icon{font-size:1.35rem}}
</style></head><body><main class="app">
<section id="setup" class="panel"><div class="hero">🐉⚔️</div><h1 style="text-align:center">Deutsch & Drachen</h1><p class="sub" style="text-align:center">Fantasy-brætspil for 7.–9. klasse · 2–4 spillere på samme enhed · tysk, taktik og held.</p><h3>Hvor mange spiller?</h3><div id="countBtns" class="setupGrid"></div><h3>Helte</h3><div id="playerSetup"></div><button id="startBtn" class="btn green wide">Begynd eventyret</button></section>
<section id="game" class="hide"><div class="topbar"><h1>🐉 Deutsch & Drachen</h1><div>Runde <b id="round">1</b>/14</div><button id="rulesBtn" class="btn">Regler</button></div><div class="gamegrid"><div class="panel"><div id="board" class="board"></div></div><aside class="panel"><h3 id="turnTitle">Tur</h3><div id="players" class="stats"></div><hr><div style="text-align:center"><div id="die" class="die">🎲</div><button id="rollBtn" class="btn green wide">Slå med terningen</button><div class="actions"><button id="potionBtn" class="btn blue">🧪 Brug eliksir</button><button id="abilityBtn" class="btn">✨ Klasseevne</button></div></div><h3>Eventyrlog</h3><div id="log" class="log"></div></aside></div></section>
<section id="finish" class="panel end hide"><div class="hero">🏆🐉</div><h1>Eventyret er slut!</h1><div id="winner" class="score"></div><div id="ranking"></div><br><button class="btn green" onclick="location.reload()">Spil igen</button></section>
<div id="modal" class="modal hide"><div class="modalbox"><div id="modalContent"></div></div></div>
<script>
const CLASSES=[['🧙','Zauberer','Feuerball: vind én monsterkamp automatisk.'],['🧝','Waldläufer','Tierfreund: +2 guld på dyrefelter og kan flygte gratis én gang.'],['🛡️','Ritter','Schildwall: starter med +2 HP og kan blokere én skade.'],['🧙‍♀️','Hexe','Verwandlung: byt ét spørgsmål ud med et nyt.']];
const TYPES=[['🌲','Wald','choice'],['📜','Quest','question'],['👹','Monster','monster'],['💰','Schatz','treasure'],['🪤','Falle','trap'],['🐾','Tier','animal'],['⚔️','Duell','duel'],['🧪','Trank','potion'],['🧙‍♂️','Händler','shop'],['🏚️','Ruine','choice']];
const ITEMS=[{name:'Eisenschwert',icon:'⚔️',desc:'+1 XP hver gang du besejrer et monster.',price:6},{name:'Silberschild',icon:'🛡️',desc:'Blokerer næste skade automatisk.',price:7},{name:'Stiefel der Eile',icon:'🥾',desc:'+1 felt næste gang du slår 1 eller 2.',price:5},{name:'Amulett',icon:'📿',desc:'Dobbelt chance for at finde en nøgle.',price:8},{name:'Zauberrolle',icon:'📜',desc:'Fjerner ét forkert svar i næste spørgsmål.',price:6}];
const MONSTERS=[['🐺','Waldwolf',2],['🕷️','Riesenspinne',2],['👺','Goblin',3],['🧌','Troll',4],['💀','Skelettkrieger',4],['🦇','Nachtbestie',3]];
const Q=[['grøn','Ordforråd','Was bedeutet „der Wald“?',['skoven','slottet','floden','bjerget'],0],['grøn','Ordforråd','Was bedeutet „gefährlich“?',['farlig','venlig','hurtig','træt'],0],['grøn','Ordforråd','Was bedeutet „das Schwert“?',['sværdet','skjoldet','kortet','slottet'],0],['grøn','Ordforråd','Was bedeutet „fliehen“?',['at flygte','at kæmpe','at hjælpe','at sove'],0],['orange','Ordstilling','Vælg den korrekte sætning.',['Ich spiele heute Fußball.','Ich heute spiele Fußball.','Heute ich Fußball spiele.','Fußball spiele ich heute nicht?'],0],['orange','Verber','Vælg korrekt: „Du ___ in Odense.“',['wohnst','wohne','wohnt','wohnen'],0],['orange','Dialog','„Was machst du gern?“',['Ich spiele gern Computerspiele.','Ich bin vierzehn Jahre alt.','Ich wohne in Dänemark.','Es regnet.'],0],['orange','Spørgeord','Hvilket ord betyder „hvorfor“?',['warum','wann','wo','wer'],0],['orange','Modalverbum','Vælg korrekt: „Ich ___ heute meine Hausaufgaben machen.“',['muss','musst','müssen','müsst'],0],['orange','Perfekt','Hvad betyder: „Ich habe Fußball gespielt.“?',['Jeg har spillet fodbold.','Jeg spiller fodbold nu.','Jeg vil spille fodbold.','Jeg må spille fodbold.'],0],['rød','Læsning','Lena schreibt: „Heute kann ich nicht kommen. Ich bin krank und bleibe zu Hause.“ Hvorfor kommer Lena ikke?',['Hun er syg.','Hun er på ferie.','Hun skal arbejde.','Hun har glemt det.'],0],['rød','Grammatik','Vælg korrekt: „Ich gehe nicht raus, ___ es regnet.“',['weil','aber','oder','und'],0],['rød','Ordstilling','Hvilken sætning er korrekt?',['Morgen spiele ich mit meinen Freunden Fußball.','Morgen ich spiele mit meinen Freunden Fußball.','Ich morgen mit meinen Freunden Fußball spiele.','Mit Freunden morgen ich Fußball spiele.'],0],['rød','Forståelse','„Obwohl es kalt ist, gehe ich schwimmen.“ Hvad sker der?',['Personen svømmer trods kulden.','Personen bliver hjemme pga. kulden.','Personen kan ikke svømme.','Det er varmt.'],0],['rød','Læsning','„Jonas fährt jeden Morgen mit dem Fahrrad zur Schule. Wenn es regnet, nimmt er den Bus.“ Hvad gør Jonas, når det regner?',['Han tager bussen.','Han cykler.','Han går.','Han bliver hjemme.'],0],['rød','Grammatik','Vælg korrekt: „Ich glaube, dass Deutsch interessant ___.“',['ist','bin','sind','seid'],0],['dyr','Tier','🐺 Welches Tier ist das?',['der Wolf','der Bär','der Fuchs','der Hund'],0],['dyr','Tier','🦊 Welches Tier ist das?',['der Fuchs','der Wolf','die Katze','das Pferd'],0],['dyr','Tier','🐻 Welches Tier ist das?',['der Bär','der Vogel','der Hase','die Maus'],0],['dyr','Tier','🦅 Welches Tier ist das?',['der Adler','der Fisch','der Frosch','der Hund'],0],['dyr','Tier','🐍 Welches Tier ist das?',['die Schlange','die Spinne','die Maus','die Katze'],0],['dyr','Tier','🦉 Welches Tier ist das?',['die Eule','der Adler','der Hase','der Fuchs'],0]];
let n=2,players=[],turn=0,round=1,busy=false,lastRoll=0;const board=[];for(let i=0;i<34;i++){let t=TYPES[i%TYPES.length];if(i===0)t=['🏰','Start','start'];if(i===33)t=['🐉','Drache','dragon'];board.push(t)}
function el(id){return document.getElementById(id)}function rand(a){return a[Math.floor(Math.random()*a.length)]}
function setupCount(){el('countBtns').innerHTML='';[2,3,4].forEach(x=>{let b=document.createElement('button');b.className='class'+(x===n?' on':'');b.textContent=x+' spillere';b.onclick=()=>{n=x;setupCount();setupPlayers()};el('countBtns').appendChild(b)})}
function setupPlayers(){el('playerSetup').innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('div');d.style.marginBottom='16px';d.innerHTML=`<h3>Spiller ${i+1}</h3><input class="name" id="pn${i}" placeholder="Navn" value="Spiller ${i+1}"><div class="classes" id="pc${i}"></div>`;el('playerSetup').appendChild(d);CLASSES.forEach((c,j)=>{let b=document.createElement('button');b.className='class'+(j===i%CLASSES.length?' on':'');b.dataset.c=j;b.innerHTML=`<div style="font-size:2rem">${c[0]}</div>${c[1]}<br><small>${c[2]}</small>`;b.onclick=()=>{[...el('pc'+i).children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};el('pc'+i).appendChild(b)})}}
function start(){players=[];for(let i=0;i<n;i++){let cls=+[...el('pc'+i).children].findIndex(x=>x.classList.contains('on'));players.push({name:el('pn'+i).value||`Spiller ${i+1}`,cls,pos:0,hp:cls===2?7:5,maxhp:cls===2?7:5,xp:0,gold:4,keys:0,potions:1,items:[],ability:true,flee:true,shield:false,boot:false,scroll:false})}el('setup').classList.add('hide');el('game').classList.remove('hide');render();log('Eventyret begynder!')}
function render(){el('round').textContent=round;el('board').innerHTML='';board.forEach((s,i)=>{let d=document.createElement('div');d.className='space'+(players[turn]?.pos===i?' current':'');d.innerHTML=`<div class="num">${i+1}</div><div class="icon">${s[0]}</div><b>${s[1]}</b><div class="tokens">${players.map((p,k)=>p.pos===i?CLASSES[p.cls][0]:'').join('')}</div>`;el('board').appendChild(d)});el('players').innerHTML=players.map((p,i)=>`<div class="player ${i===turn?'turn':''}"><b>${CLASSES[p.cls][0]} ${p.name}</b><div class="meter"><span>❤️ ${p.hp}/${p.maxhp}</span><span>⭐ ${p.xp}</span><span>🪙 ${p.gold}</span><span>🔑 ${p.keys}</span><span>🧪 ${p.potions}</span></div><div class="inventory">🎒 ${p.items.length?p.items.map(x=>x.icon+' '+x.name).join(' · '):'tomt'}</div></div>`).join('');el('turnTitle').textContent=`${players[turn].name}s tur`;el('rollBtn').disabled=busy}
function log(t){let d=document.createElement('div');d.textContent='• '+t;el('log').prepend(d)}
function roll(){if(busy)return;busy=true;let r=1+Math.floor(Math.random()*6),p=players[turn];lastRoll=r;el('die').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r-1];let move=r;if(p.boot&&r<=2){move++;p.boot=false;p.items=p.items.filter(x=>x.name!=='Stiefel der Eile');log(`${p.name}s støvler giver +1 felt.`)}p.pos=Math.min(33,p.pos+move);log(`${p.name} slog ${r} og rykkede ${move}.`);render();setTimeout(()=>resolveSpace(p),350)}
function resolveSpace(p){let type=board[p.pos][2];if(type==='start')return nextTurn();if(type==='treasure')return treasure(p);if(type==='trap')return trap(p);if(type==='potion'){p.potions++;log(`${p.name} fandt en Heiltrank.`);return modal(`<h2>🧪 Heiltrank</h2><p>Du fandt en eliksir. Den kan senere give 2 HP.</p>`,nextTurn)}if(type==='duel'&&players.length>1)return duel(p);if(type==='dragon')return dragon(p);if(type==='shop')return shop(p);if(type==='monster')return monster(p);if(type==='choice')return adventureChoice(p);ask(p,type)}
function treasure(p){let g=4+Math.floor(Math.random()*6);p.gold+=g;let extra=Math.random()<.28;if(extra){let item=rand(ITEMS);giveItem(p,item);modal(`<h2>💰 Schatz!</h2><p>Du finder ${g} guld og <b>${item.icon} ${item.name}</b>.</p><p class="small">${item.desc}</p>`,nextTurn)}else modal(`<h2>💰 Schatz!</h2><p>Du finder ${g} guld.</p>`,nextTurn)}
function trap(p){let q=rand(Q.filter(x=>x[0]==='orange'));showQuestion(q,'🪤 Falle! Entschärfe die Falle',ok=>{if(ok){p.xp+=2;log(`${p.name} afmonterede fælden.`)}else damage(p);nextTurn()})}
function giveItem(p,item){if(item.name==='Silberschild')p.shield=true;if(item.name==='Stiefel der Eile')p.boot=true;if(item.name==='Zauberrolle')p.scroll=true;p.items.push(item)}
function shop(p){let choices=ITEMS.filter(x=>x.price<=p.gold);if(!choices.length)return modal(`<h2>🧙‍♂️ Händler</h2><p>„Du hast nicht genug Gold!“</p><p>Du har ${p.gold} guld.</p>`,nextTurn);let html=choices.map((x,i)=>`<button class="choice" data-i="${i}">${x.icon} <b>${x.name}</b><br>${x.price} 🪙<br><small>${x.desc}</small></button>`).join('');modalRaw(`<h2>🧙‍♂️ Händler</h2><p>„Was möchtest du kaufen?“</p><div class="choices">${html}<button class="choice" id="skipShop">🚪 Nichts kaufen</button></div>`);document.querySelectorAll('.choice[data-i]').forEach(b=>b.onclick=()=>{let item=choices[+b.dataset.i];p.gold-=item.price;giveItem(p,item);log(`${p.name} købte ${item.name}.`);el('modal').classList.add('hide');nextTurn()});el('skipShop').onclick=()=>{el('modal').classList.add('hide');nextTurn()}}
function monster(p){let m=rand(MONSTERS);modalRaw(`<div class="monster">${m[0]}</div><h2>${m[1]} erscheint!</h2><p>Monsterstyrke: ${m[2]}.</p><p>Hvad gør du?</p><div class="choices"><button id="fight" class="choice">⚔️ <b>kämpfen</b><br><small>kæmp – svær tysk opgave, stor belønning</small></button><button id="run" class="choice">🏃 <b>fliehen</b><br><small>flygt – lettere opgave, men du kan miste guld</small></button></div>`);el('fight').onclick=()=>fightMonster(p,m);el('run').onclick=()=>fleeMonster(p,m)}
function fightMonster(p,m){if(p.cls===0&&p.ability){modalRaw(`<h2>🧙 Feuerball?</h2><p>Vil du bruge din klasseevne og besejre ${m[1]} automatisk?</p><div class="choices"><button id="yesPower" class="choice">🔥 Feuerball</button><button id="noPower" class="choice">⚔️ Kämpfen</button></div>`);el('yesPower').onclick=()=>{p.ability=false;monsterWin(p,m);el('modal').classList.add('hide');nextTurn()};el('noPower').onclick=()=>monsterQuestion(p,m);return}monsterQuestion(p,m)}
function monsterQuestion(p,m){let pool=Q.filter(x=>x[0]==='orange'||x[0]==='rød');showQuestion(rand(pool),`${m[0]} Kampf gegen ${m[1]}`,ok=>{if(ok){monsterWin(p,m)}else damage(p);nextTurn()})}
function monsterWin(p,m){let bonus=p.items.some(x=>x.name==='Eisenschwert')?1:0;p.xp+=m[2]+2+bonus;p.gold+=m[2];log(`${p.name} besejrede ${m[1]} og fik ${m[2]+2+bonus} XP.`);keyChance(p)}
function fleeMonster(p,m){if(p.cls===1&&p.flee){p.flee=false;log(`${p.name} bruger Tierfreund og flygter sikkert.`);el('modal').classList.add('hide');nextTurn();return}let q=rand(Q.filter(x=>x[0]==='grøn'||x[0]==='orange'));showQuestion(q,'🏃 Flucht!',ok=>{if(ok){log(`${p.name} slap væk.`)}else{p.gold=Math.max(0,p.gold-2);damage(p);log(`${p.name} tabte 2 guld under flugten.`)}nextTurn()})}
function adventureChoice(p){modalRaw(`<h2>🌲 Eine Entscheidung</h2><p>Du hører en stemme fra skoven: „Hilfe!“</p><p>Hvad vil du gøre?</p><div class="choices"><button id="help" class="choice">🤝 <b>helfen</b><br><small>hjælp – dialog/læsning</small></button><button id="search" class="choice">🔎 <b>suchen</b><br><small>undersøg – ordforråd</small></button><button id="leave" class="choice">🚶 <b>weitergehen</b><br><small>gå videre – sikker, men ingen belønning</small></button></div>`);el('help').onclick=()=>{let q=rand(Q.filter(x=>x[1]==='Læsning'||x[1]==='Dialog'));showQuestion(q,'🤝 Helfen',ok=>{if(ok){p.xp+=4;p.gold+=2;keyChance(p)}else damage(p);nextTurn()})};el('search').onclick=()=>{let q=rand(Q.filter(x=>x[0]==='grøn'||x[0]==='dyr'));showQuestion(q,'🔎 Suchen',ok=>{if(ok){p.xp+=2;if(Math.random()<.5)p.potions++}else damage(p);nextTurn()})};el('leave').onclick=()=>{el('modal').classList.add('hide');log(`${p.name} gik videre uden risiko.`);nextTurn()}}
function keyChance(p){let chance=p.items.some(x=>x.name==='Amulett')?.42:.22;if(Math.random()<chance){p.keys++;log(`${p.name} fandt en nøgle! 🔑`)}}
function pickQ(type){let pool=type==='animal'?Q.filter(q=>q[0]==='dyr'):Q.filter(q=>q[0]!=='dyr');return rand(pool)}
function ask(p,type){let q=pickQ(type);let reward=type==='animal'?3:2;showQuestion(q,`${board[p.pos][0]} ${board[p.pos][1]}`,ok=>{if(ok){p.xp+=reward;if(type==='animal'&&p.cls===1)p.gold+=2;keyChance(p)}else damage(p);nextTurn()})}
function damage(p){if(p.shield){p.shield=false;p.items=p.items.filter(x=>x.name!=='Silberschild');log(`${p.name}s Silberschild blokerede skaden.`);return}if(p.cls===2&&p.ability){p.ability=false;log(`${p.name} bruger Schildwall og blokerer skaden.`);return}p.hp=Math.max(0,p.hp-1);log(`${p.name} mistede 1 HP.`);if(p.hp===0){p.hp=2;p.pos=Math.max(0,p.pos-5);p.gold=Math.max(0,p.gold-3);log(`${p.name} blev slået ud og vågner 5 felter tilbage med 2 HP.`)}}
function usePotion(){if(busy)return;let p=players[turn];if(p.potions<1||p.hp>=p.maxhp)return;p.potions--;p.hp=Math.min(p.maxhp,p.hp+2);log(`${p.name} drikker en Heiltrank og får 2 HP.`);render()}
function useAbility(){if(busy)return;let p=players[turn];if(!p.ability)return;if(p.cls===3){p.ability=false;log(`${p.name} aktiverer Verwandlung: næste spørgsmål kan byttes.`);p.scroll=true;render();return}modal(`<h2>✨ ${CLASSES[p.cls][1]}</h2><p>${CLASSES[p.cls][2]}</p><p>Evnen bruges automatisk, når den kan hjælpe dig.</p>`,()=>{})}
function showQuestion(q,title,cb){let opts=q[3].map((a,i)=>`<button class="answer" data-i="${i}">${a}</button>`).join('');let p=players[turn];let reroll=p.scroll?`<button id="rerollQ" class="btn blue wide" style="margin-bottom:10px">📜 Nyt spørgsmål</button>`:'';modalRaw(`<span class="badge">${q[0].toUpperCase()} · ${q[1]}</span><h2>${title}</h2>${reroll}<div class="q">${q[2]}</div><div class="answers">${opts}</div><div id="qfb" class="feedback"></div>`);if(p.scroll){el('rerollQ').onclick=()=>{p.scroll=false;p.items=p.items.filter(x=>x.name!=='Zauberrolle');let nq=rand(Q.filter(x=>x!==q&&x[0]!=='dyr'));showQuestion(nq,title,cb)}}document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let ok=+b.dataset.i===q[4];b.classList.add(ok?'ok':'no');if(!ok)document.querySelectorAll('.answer')[q[4]].classList.add('ok');el('qfb').textContent=ok?'✓ Rigtigt!':'✗ Det rigtige svar er: '+q[3][q[4]];setTimeout(()=>{el('modal').classList.add('hide');cb(ok)},800)})}
function duel(p){let rivals=players.filter(x=>x!==p);let r=rand(rivals);let q=rand(Q.filter(x=>x[0]==='orange'||x[0]==='rød'));modalRaw(`<h2>⚔️ Sprachduell!</h2><p><b>${p.name}</b> udfordrer <b>${r.name}</b>. Begge vælger. Rigtigt svar giver 3 XP; alene korrekt giver også 3 guld.</p><div class="q">${q[2]}</div><h3>${p.name}</h3><div class="answers" id="a1"></div><h3>${r.name}</h3><div class="answers" id="a2"></div>`);let picks=[null,null];['a1','a2'].forEach((id,z)=>{q[3].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{picks[z]=i;[...el(id).children].forEach(x=>x.classList.remove('ok'));b.classList.add('ok');if(picks.every(x=>x!==null)){let o1=picks[0]===q[4],o2=picks[1]===q[4];if(o1)p.xp+=3;if(o2)r.xp+=3;if(o1&&!o2)p.gold+=3;if(o2&&!o1)r.gold+=3;modal(`<h2>⚔️ Resultat</h2><p>Rigtigt svar: <b>${q[3][q[4]]}</b>.</p><p>${p.name}: ${o1?'✓':'✗'} &nbsp; ${r.name}: ${o2?'✓':'✗'}</p>`,nextTurn)}};el(id).appendChild(b)})})}
function dragon(p){let need=2;let red=Q.filter(x=>x[0]==='rød');showQuestion(rand(red),'🐉 DRACHENKAMPF!',ok=>{if(ok&&p.keys>=need){p.xp+=12;p.gold+=12;log(`${p.name} besejrede dragen!`);finish()}else if(ok){p.xp+=5;modal(`<h2>🐉 Fast!</h2><p>Du løste opgaven, men mangler ${need-p.keys} nøgle(r). Du sendes tilbage.</p>`,()=>{p.pos=26;nextTurn()})}else{damage(p);p.pos=26;modal(`<h2>🔥 Der Drache greift an!</h2><p>Du sendes tilbage til felt 27.</p>`,nextTurn)}})}
function nextTurn(){el('modal').classList.add('hide');turn++;if(turn>=players.length){turn=0;round++;if(round>14){finish();return}}busy=false;render()}
function finish(){el('modal').classList.add('hide');el('game').classList.add('hide');el('finish').classList.remove('hide');let rank=[...players].sort((a,b)=>scoreOf(b)-scoreOf(a));el('winner').textContent=`${CLASSES[rank[0].cls][0]} ${rank[0].name} vinder!`;el('ranking').innerHTML=rank.map((p,i)=>`<p><b>${i+1}. ${p.name}</b> · ⭐ ${p.xp} · 🪙 ${p.gold} · 🔑 ${p.keys} · 🎒 ${p.items.length} · samlet ${scoreOf(p)}</p>`).join('')}
function scoreOf(p){return p.xp+p.gold+p.keys*4+p.items.length*2}
function modal(html,done){modalRaw(html+`<br><button id="continue" class="btn green wide">Fortsæt</button>`);el('continue').onclick=()=>{el('modal').classList.add('hide');done()}}
function modalRaw(html){el('modalContent').innerHTML=html;el('modal').classList.remove('hide')}
el('rulesBtn').onclick=()=>modal(`<h2>📜 Regeln</h2><p>I spiller på skift. Slå terningen og løs tyske udfordringer. I kan møde monstre, handle udstyr, finde skatte og træffe valg.</p><p><b>Fantasy-ord:</b> kämpfen = kæmpe · fliehen = flygte · helfen = hjælpe · suchen = lede · weitergehen = gå videre.</p><p><b>Dragen:</b> Kræver mindst 2 nøgler og et korrekt rødt spørgsmål.</p><p><b>Vinder:</b> XP + guld + 4 point pr. nøgle + 2 point pr. udstyr.</p>`,()=>{});el('rollBtn').onclick=roll;el('potionBtn').onclick=usePotion;el('abilityBtn').onclick=useAbility;el('startBtn').onclick=start;setupCount();setupPlayers();
</script></main></body></html>
