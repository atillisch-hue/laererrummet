<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch & Drachen</title><style>body{margin:0;background:#101820;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:760px;padding:28px;text-align:center}#err{color:#ffb4b4;white-space:pre-wrap}</style></head><body><div class="box"><h1>🐉 Deutsch & Drachen</h1><p>Das Abenteuer wird geladen …</p><p id="err"></p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/atillisch-hue/laererrummet/main/public/tysk-mission/dd-parts/';const names=['gz1.txt','gz2.txt','gz3.txt'];const parts=[];for(const n of names){const r=await fetch(base+n+'?v=7a7c6b738164b3e78a3cb070a0b1009f94517f59',{cache:'no-store'});if(!r.ok)throw new Error('Kunne ikke hente '+n+' ('+r.status+')');parts.push((await r.text()).trim())}let b64=parts.join('').replace(/[^A-Za-z0-9+/=]/g,'');while(b64.length%4)b64+='=';const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Browseren understøtter ikke dekomprimering. Brug en nyere Chrome, Edge eller Safari.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('err').textContent='Fejl ved indlæsning: '+e.message}})();</script></body></html>
